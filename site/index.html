<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終電ファースト飲み会ナビ</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b313d;
  --fg:#e8ecf3; --muted:#9aa4b5; --accent:#ffb037; --accent2:#4fd1a5; --warn:#ff6b6b;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f6; --line:#dde2ea;
    --fg:#171a21; --muted:#5d6675; --accent:#c97a06; --accent2:#0f9b74; --warn:#d23b3b;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.55}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:17px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
.app{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 50px)}
.app.has-result{grid-template-columns:330px 380px 1fr}
#result{display:none}
.app.has-result #result{display:block}
.pane{overflow-y:auto;border-right:1px solid var(--line);padding:12px}
.pane h2{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.05em}
#map{width:100%;height:100%}
@media(max-width:1000px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .pane{border-right:none;border-bottom:1px solid var(--line);max-height:none}
  #mapwrap{height:60vh}
}
.person{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;
  padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel2)}
.person .dot{width:12px;height:12px;border-radius:50%}
.person .del{background:none;border:none;color:var(--muted);padding:2px 4px;font-size:15px;line-height:1}
.person .del:hover{color:var(--warn)}
.sample{display:flex;gap:6px;margin-bottom:8px}
.sample button{flex:1;font-size:12px;padding:6px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:6px 8px;max-width:100%}
input[type=range]{padding:0;border:none;background:none;width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:#1a1200;border:none;font-weight:700;padding:10px;width:100%;border-radius:9px}
button.ghost{background:none;border:1px dashed var(--line);color:var(--muted);width:100%;padding:7px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:12px;color:var(--muted);min-width:82px}
.bus{grid-column:1/-1;display:none}
.bus.on{display:block}
.bus select{width:100%}
.tag{font-size:11px;color:var(--muted)}
.banner{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.banner b{color:var(--accent)}
.cand{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;margin-bottom:7px}
.cand:hover{border-color:var(--accent)}
.cand.sel{border-color:var(--accent);background:var(--panel2)}
.rank{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);
  color:var(--muted);font-size:11px;font-weight:700}
.cand.sel .rank{background:var(--accent);color:#1a1200}
.nm{font-size:15px;font-weight:700}
.meta{font-size:11px;color:var(--muted)}
.stay{text-align:right}
.stay b{font-size:17px;color:var(--accent2);white-space:nowrap}
.stay div{font-size:10px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:10px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.bar i.short{background:var(--warn)}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.hot{border-color:var(--warn);color:var(--warn)}
.empty{color:var(--muted);font-size:12px;padding:16px;text-align:center}
.legend{position:absolute;left:10px;bottom:24px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;font-size:11px;z-index:2;max-width:250px}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend s{width:18px;height:3px;border-radius:2px;display:inline-block}
.mk{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mk.sta{width:17px;height:17px;background:#fff;border:4px solid var(--accent);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.mk.bar{width:7px;height:7px;border-width:1px}
.maplibregl-popup-content{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;font-size:12px;padding:7px 10px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
</style>
</head>
<body>
<header>
  <h1>終電ファースト<span>飲み会ナビ</span></h1>
  <div class="sub">「早く帰らないといけない人」が<b>いちばん長くいられる駅</b>を探し、<b>帰りの経路</b>まで地図に描きます。</div>
</header>

<div class="app">
  <!-- 1. 設定 -->
  <div class="pane">
    <h2>参加者（自宅の最寄り駅）</h2>
    <div class="sample">
      <button id="sample">サンプルの5人を入れる</button>
      <button id="clear">全部消す</button>
    </div>
    <div id="people"></div>
    <button class="ghost" id="add">＋ 参加者を追加</button>
    <div class="row"><label>集合時刻</label><select id="depart"></select></div>
    <div class="row"><label>飲み屋 最低</label><input type="range" id="minbars" min="10" max="150" step="5" value="30">
      <span class="tag" id="minbarsv"></span></div>
    <div class="row"><label>片道の上限</label><input type="range" id="maxtravel" min="20" max="120" step="5" value="70">
      <span class="tag" id="maxtravelv"></span></div>
    <button class="primary" id="go">集合駅を探す</button>
    <div class="tag" id="status" style="margin-top:8px"></div>
    <h2 style="margin-top:16px">使っているオープンデータ</h2>
    <div class="tag" id="credits"></div>
  </div>

  <!-- 2. 計算結果 -->
  <div class="pane" id="result">
    <h2>計算結果</h2>
    <div id="banner"></div>
    <div id="list"></div>
    <div id="detail"></div>
  </div>

  <!-- 3. 地図 -->
  <div id="mapwrap" style="position:relative">
    <div id="map"></div>
    <div class="legend" id="legend" style="display:none"></div>
  </div>
</div>

<datalist id="stations"></datalist>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="engine.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=v=>`${String(Math.floor(v/60)%24).padStart(2,"0")}:${String(v%60).padStart(2,"0")}`;
const hm=s=>{const[a,b]=s.split(":");return +a*60+ +b};
const COLORS=["#4fd1a5","#59a5f5","#c48cf0","#f58fb0","#8fd14f","#f0b429","#6fd6d6","#d98e5a"];
let META=null,RESULT=null,SEL=0,MAP=null,DETAIL=null,MARKERS=[];
const SAMPLE=[["荻窪","下井草二丁目"],["川口",null],["西船橋",null],["蒲田",null],["聖蹟桜ヶ丘","聖ヶ丘団地"]];

/* ---------- 地図 ---------- */
function initMap(){
  MAP=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",
    center:[139.7025,35.6595],zoom:10,localIdeographFontFamily:"'Hiragino Sans','Noto Sans JP',sans-serif",
    attributionControl:{compact:true}});
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  MAP.on("load",()=>{
    MAP.addSource("routes",{type:"geojson",data:empty()});
    MAP.addLayer({id:"route-case",type:"line",source:"routes",
      paint:{"line-color":"#000","line-opacity":.22,"line-width":["case",["get","tight"],10,5]},
      layout:{"line-cap":"round","line-join":"round"}});
    MAP.addLayer({id:"route-other",type:"line",source:"routes",
      filter:["all",["!",["get","tight"]],["!=",["get","kind"],"walk"]],
      paint:{"line-color":["get","color"],"line-width":3,"line-opacity":.85},
      layout:{"line-cap":"round","line-join":"round"}});
    MAP.addLayer({id:"route-walk",type:"line",source:"routes",
      filter:["==",["get","kind"],"walk"],
      paint:{"line-color":["get","color"],"line-width":3,"line-dasharray":[1,1.6]},
      layout:{"line-cap":"round","line-join":"round"}});
    MAP.addLayer({id:"route-tight",type:"line",source:"routes",
      filter:["all",["get","tight"],["!=",["get","kind"],"walk"]],
      paint:{"line-color":"#ffb037","line-width":6},
      layout:{"line-cap":"round","line-join":"round"}});
    MAP.addSource("bars",{type:"geojson",data:empty()});
    // 引いたときは面（かたまり）で、寄ったらジョッキの絵で見せる
    MAP.addLayer({id:"bars-blob",type:"circle",source:"bars",maxzoom:13.5,
      paint:{"circle-color":"#ff7a18","circle-opacity":.45,"circle-blur":.2,
        "circle-radius":["interpolate",["linear"],["zoom"],8,4.5,10,7,12,8,13.5,8]}});
    addBeer().then(()=>{
      MAP.addLayer({id:"bars-dot",type:"symbol",source:"bars",minzoom:12.5,
        layout:{"icon-image":"beer","icon-padding":0,"icon-allow-overlap":false,
          "icon-size":["interpolate",["linear"],["zoom"],12.5,.45,15,.7,17,.95]}});
    });
    MAP.on("click","bars-dot",e=>{
      const p=e.features[0].properties;
      new maplibregl.Popup({closeButton:false}).setLngLat(e.lngLat)
        .setHTML(`<b>${p.name||"（名前なし）"}</b><br><span style="opacity:.7">${p.kind}</span>`).addTo(MAP);
    });
    MAP.on("mouseenter","bars-dot",()=>MAP.getCanvas().style.cursor="pointer");
    MAP.on("mouseleave","bars-dot",()=>MAP.getCanvas().style.cursor="");
    MAP.on("click","bars-blob",e=>MAP.easeTo({center:e.lngLat,zoom:14}));
  });
}
const empty=()=>({type:"FeatureCollection",features:[]});
// ビールジョッキの絵を作って地図のアイコンに登録する
function addBeer(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <g stroke="#7a3d00" stroke-width="3.2" stroke-linejoin="round">
      <path d="M44 26h7a6 6 0 0 1 0 12h-7z" fill="#ffd9a0"/>
      <path d="M15 22h30v28a6 6 0 0 1-6 6H21a6 6 0 0 1-6-6z" fill="#f5a623"/>
      <path d="M15 22c0-6 5-9 8-9 2-4 9-5 12-2 5-2 10 1 10 6 0 3-2 5-5 5z" fill="#fff8ee"/>
    </g>
    <path d="M22 30h5v18h-5z" fill="#ffd98a" opacity=".85"/>
  </svg>`;
  return new Promise(res=>{
    const img=new Image(64,64);
    img.onload=()=>{if(!MAP.hasImage("beer")) MAP.addImage("beer",img); res()};
    img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
  });
}
function clearMarkers(){MARKERS.forEach(m=>m.remove());MARKERS=[]}
function marker(lat,lon,cls,html){
  const el=document.createElement("div"); el.className="mk "+cls;
  const m=new maplibregl.Marker({element:el}).setLngLat([lon,lat]);
  if(html) m.setPopup(new maplibregl.Popup({closeButton:false,offset:10}).setHTML(html));
  m.addTo(MAP); MARKERS.push(m); return m;
}

function drawDetail(d){
  DETAIL=d;
  MAP.getSource("bars").setData({type:"FeatureCollection",features:d.bars.map(b=>
    ({type:"Feature",geometry:{type:"Point",coordinates:[b.lon,b.lat]},properties:{name:b.name,kind:b.kind}}))});
  const feats=[];
  d.routes.forEach((r,i)=>{
    const color=COLORS[i%COLORS.length], tight=(i===d.tight);
    r.legs.forEach(l=>{
      const co=(l.shape||l.stops.map(s=>[s.lat,s.lon])).map(p=>[p[1],p[0]]);
      if(co.length<2) return;
      feats.push({type:"Feature",geometry:{type:"LineString",coordinates:co},
        properties:{color:tight?"#ffb037":color,tight,kind:l.kind,who:r.name,line:l.line}});
    });
  });
  MAP.getSource("routes").setData({type:"FeatureCollection",features:feats});

  clearMarkers();
  marker(d.lat,d.lon,"sta",`<b>${d.station}</b><br>集合駅・飲み屋 ${d.bars.length}軒`);
  const b=new maplibregl.LngLatBounds([d.lon,d.lat],[d.lon,d.lat]);
  d.routes.forEach((r,i)=>{
    const tight=(i===d.tight);
    const el=document.createElement("div"); el.className="mk";
    el.style.background=tight?"#ffb037":COLORS[i%COLORS.length];
    if(tight){el.style.width="15px";el.style.height="15px"}
    const last=r.legs.length?r.legs[r.legs.length-1].stops.slice(-1)[0]:null;
    const lat=last?last.lat:r.home_lat, lon=last?last.lon:r.home_lon;
    const mk=new maplibregl.Marker({element:el}).setLngLat([lon,lat])
      .setPopup(new maplibregl.Popup({closeButton:false,offset:10})
        .setHTML(`<b>${r.name}</b> の自宅<br>${r.bus?r.bus+"（バス）":r.home+"駅"}<br>帰宅リミット ${r.limit_s}`));
    mk.addTo(MAP); MARKERS.push(mk);
    b.extend([lon,lat]);
    r.legs.forEach(l=>(l.shape||l.stops.map(s=>[s.lat,s.lon])).forEach(p=>b.extend([p[1],p[0]])));
  });
  MAP.fitBounds(b,{padding:{top:50,bottom:50,left:50,right:50},duration:700,maxZoom:13});
  $("#legend").style.display="";
  $("#legend").innerHTML=`<div><span class="mk sta"></span> 集合駅 ${d.station}</div>
    <div><span class="mk bar" style="background:#ff7a18"></span> 飲み屋 ${d.bars.length}軒（500m以内・寄るとジョッキの印。クリックで店名）</div>
    ${d.routes.map((r,i)=>`<div><s style="background:${i===d.tight?"#ffb037":COLORS[i%COLORS.length]};
      height:${i===d.tight?5:3}px"></s> ${r.name} ${r.limit_s}${i===d.tight?" ← 一番早い":""}</div>`).join("")}
    <div class="tag" style="margin-top:4px">点線は徒歩。駅間は直線で結んでいます</div>`;
}

/* ---------- 入力 ---------- */
async function boot(){
  initMap();
  META=await API.meta();
  $("#stations").innerHTML=META.stations.map(s=>`<option value="${s.n}">`).join("");
  $("#depart").innerHTML=META.presets.map(v=>`<option value="${v}"${v===19*60?" selected":""}>${fmt(v)}</option>`).join("");
  bindRange("minbars","軒"); bindRange("maxtravel","分");
  credits();
}
// 開発者ガイドライン 3.1 が求める 3 点（提供元・無保証・問い合わせ先）と、静的データの取得日
function credits(){
  const a=META.acquired||{}, c=META.contact||{};
  $("#credits").innerHTML=`
    このアプリは<b>公共交通オープンデータセンター</b>で提供されるデータを利用しています
    （鉄道10事業者65路線の列車時刻表・駅情報、GTFS-JP の関東バス・京王バス・都営バス）。
    データの<b>正確性・完全性が保証されたものではありません</b>。実際の運行とは異なる場合があります。
    <b>交通事業者への直接のお問い合わせはご遠慮ください。</b>
    ${c.contact_url?`お問い合わせは <a href="${c.contact_url}">${c.contact_label}</a> へ。`:""}
    <br>静的データの取得日: 鉄道 ${a.odpt||"-"} / バス ${a.bus_gtfs||"-"} / OpenStreetMap ${a.osm||"-"}
    （この画面の計算結果は ${META.built||"-"} 時点）。
    <br>飲み屋の位置は OpenStreetMap（<code>amenity=pub/bar/nightclub</code>、ODbL）。
    地図 © OpenFreeMap © OpenMapTiles © OpenStreetMap contributors。`;
}
function bindRange(id,unit){const el=$("#"+id),out=$("#"+id+"v");el.oninput=()=>out.textContent=el.value+unit;el.oninput()}
function addPerson(station=""){
  const d=document.createElement("div"); d.className="person";
  d.innerHTML=`<span class="dot"></span>
    <input type="text" class="st" list="stations" placeholder="自宅の最寄り駅" value="${station}">
    <button class="del" title="消す">×</button>
    <label class="tag" style="grid-column:1/-1"><input type="checkbox" class="usebus"> 駅から路線バスに乗り継ぐ</label>
    <div class="bus"><select class="stop"></select></div>`;
  $("#people").appendChild(d);
  const cb=d.querySelector(".usebus"),box=d.querySelector(".bus"),st=d.querySelector(".st");
  cb.onchange=async()=>{box.classList.toggle("on",cb.checked); if(cb.checked) await loadStops(d)};
  st.onchange=()=>{if(cb.checked) loadStops(d)};
  d.querySelector(".del").onclick=()=>{d.remove();recolor()};
  recolor();
  return d;
}
function recolor(){$$(".person").forEach((d,i)=>d.querySelector(".dot").style.background=COLORS[i%COLORS.length])}
async function loadStops(d){
  const st=d.querySelector(".st").value.trim(), sel=d.querySelector(".stop");
  const list=await API.busstops(st);
  if(!list.length){sel.innerHTML=`<option value="">（この駅のバスデータはありません）</option>`;sel.dataset.json="";return}
  sel.innerHTML=list.map((b,i)=>`<option value="${i}">${b.stop}（最終 ${fmt(b.last)}・${b.ride}分）</option>`).join("");
  sel.dataset.json=JSON.stringify(list);
}
$("#add").onclick=()=>addPerson();
$("#clear").onclick=()=>{$("#people").innerHTML="";$(".app").classList.remove("has-result")};
$("#sample").onclick=async()=>{
  $("#people").innerHTML="";
  for(const [st,stop] of SAMPLE){
    const d=addPerson(st);
    if(stop){
      d.querySelector(".usebus").checked=true;
      d.querySelector(".bus").classList.add("on");
      await loadStops(d);
      const sel=d.querySelector(".stop");
      const list=JSON.parse(sel.dataset.json||"[]");
      const k=list.findIndex(b=>b.stop===stop);
      if(k>=0) sel.value=k;
    }
  }
};

function collect(){
  return $$(".person").map(d=>{
    const station=d.querySelector(".st").value.trim(); if(!station) return null;
    const o={station};
    const sel=d.querySelector(".stop");
    if(d.querySelector(".usebus").checked&&sel.dataset.json){
      const b=JSON.parse(sel.dataset.json)[+sel.value]; if(b) o.bus=b;
    }
    return o;
  }).filter(Boolean);
}

$("#go").onclick=async()=>{
  const people=collect();
  if(people.length<2){$("#status").textContent="自宅の最寄り駅を 2 つ以上入れてください。";return}
  $("#status").textContent="計算中…";
  const j=await API.search({people,depart:+$("#depart").value,
    min_bars:+$("#minbars").value,max_travel:+$("#maxtravel").value});
  if(j.error){$("#status").textContent="エラー: "+j.error;return}
  RESULT=j; RESULT._people=people; SEL=0;
  $("#status").textContent=`候補 ${j.n_ok} 駅 / 全員が行ける ${j.n_all} 駅`;
  $(".app").classList.add("has-result");
  MAP.resize();
  render(); select(0);
};

function render(){
  const j=RESULT,c=j.candidates;
  if(!c.length){$("#list").innerHTML=`<div class="empty">条件に合う駅がありません。しきい値をゆるめてください。</div>`;
    $("#banner").innerHTML="";$("#detail").innerHTML="";return}
  const best=c[0],bt=j.by_time;
  $("#banner").innerHTML=`<div class="banner">移動時間だけで選ぶと <b>${bt.name}</b>
    （いちばん早い人の終電 ${fmt(bt.min_limit)}・滞在 ${bt.min_stay}分）。
    この方式だと <b>${best.name}</b>（終電 ${fmt(best.min_limit)}・滞在 ${best.min_stay}分）で
    <b>${best.min_stay-bt.min_stay>=0?"+":""}${best.min_stay-bt.min_stay}分</b> 長くいられます。</div>`;
  $("#list").innerHTML=c.map((r,i)=>`<div class="cand ${i===SEL?"sel":""}" data-i="${i}">
      <div class="rank">${i+1}</div>
      <div><div class="nm">${r.name}</div>
        <div class="meta">飲み屋 ${r.bars}軒${r.median_m?`・店まで中央値${r.median_m}m`:""} ・${r.lines}路線
          ・滞在 ${r.min_stay}分</div></div>
      <div class="stay"><b>${fmt(r.min_limit)}</b><div>${j.people[r.tight].name} の終電</div></div></div>`).join("");
  $$(".cand").forEach(el=>el.onclick=()=>select(+el.dataset.i));
}

async function select(i){
  SEL=i; render();
  const r=RESULT.candidates[i];
  $("#detail").innerHTML=`<div class="tag" style="padding:8px">${r.name} の経路を計算中…</div>`;
  const d=await API.detail({people:RESULT._people,station:r.name,depart:RESULT.depart});
  if(d.error){$("#detail").innerHTML=`<div class="empty">${d.error}</div>`;return}
  drawDetail(d); renderDetail(d);
}

function renderDetail(d){
  const j=RESULT,r=j.candidates[SEL];
  const endMax=Math.min(...r.limits), endDefault=Math.max(j.depart+60,endMax-30);
  $("#detail").innerHTML=`<h2 style="margin-top:14px">${r.name} に集まったら</h2>
    <div class="row"><label>一次会の終了</label>
      <input type="range" id="endt" min="${j.depart+60}" max="${endMax}" step="5" value="${endDefault}">
      <span class="tag" id="endtv"></span></div>
    <div id="after"></div>
    <h2 style="margin-top:12px">帰りの経路</h2>
    ${d.routes.map((x,i)=>`<div style="margin-bottom:7px;border-left:3px solid ${i===d.tight?"#ffb037":COLORS[i%COLORS.length]};padding-left:8px">
        <div style="font-size:13px"><b>${x.name}</b> ${x.limit_s} 発
          ${i===d.tight?'<span class="pill hot">一番早い</span>':""}</div>
        <div class="tag">${x.legs.map(l=>`${l.line}（${l.stops[0].name}${l.stops[0].time?" "+l.stops[0].time:""}
          →${l.stops.slice(-1)[0].name}${l.stops.slice(-1)[0].time?" "+l.stops.slice(-1)[0].time:""}）`).join(" ／ ")||"経路なし"}</div>
      </div>`).join("")}`;
  const sl=$("#endt");
  sl.oninput=()=>{
    $("#endtv").textContent=fmt(+sl.value);
    const t=+sl.value,NIJI=60;
    const rest=j.people.map((p,k)=>({name:p.name,left:r.limits[k]-t,out:r.limits[k]}));
    $("#after").innerHTML=`<div class="banner" style="border-left-color:var(--accent2)">
        <b>${fmt(t)}</b> に締めると、二次会に 1 時間いられるのは <b>${rest.filter(x=>x.left>=NIJI).length} / ${rest.length} 人</b>。
        ${rest.filter(x=>x.left<NIJI).map(x=>`<span class="pill hot">${x.name} は ${fmt(x.out)} に出る</span>`).join(" ")}</div>
      <table><thead><tr><th>参加者</th><th>あと何分いられるか</th><th></th></tr></thead><tbody>
      ${rest.map(x=>`<tr><td>${x.name}</td>
        <td style="width:58%"><div class="bar"><i class="${x.left<NIJI?"short":""}"
          style="width:${Math.max(0,Math.min(100,x.left/180*100))}%"></i></div></td>
        <td>${x.left<=0?"もう出ないと帰れません":x.left+"分"}</td></tr>`).join("")}</tbody></table>`;
  };
  sl.oninput();
}
boot();
</script>
</body>
</html>
